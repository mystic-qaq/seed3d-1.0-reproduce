data:
  num_queries: 2048
  pc_sharpedge_size: 1024
  pc_size: 4096
  shard_dir: data/shards
  val_shards: true
  near_ratio: 0.7
  near_query_ratio: 0.9
model:
  _target: seed3d_mini.models.vae.Seed3DVAE
  decoder_self_attn: latent
  downsample_ratio: 20
  embed_dim: 32
  heads: 6
  include_pi: true
  lambda_eikonal: 0.01
  lambda_kl: 5.0e-05
  mlp_expand_ratio: 4
  num_decoder_layers: 4
  num_encoder_layers: 8
  num_freqs: 8
  num_latents: 512
  pc_sharpedge_size: 1024
  pc_size: 4096
  point_feats: 3
  qk_norm: false
  qkv_bias: true
  tanh_output: false
  train_num_latents:
  - 256
  - 384
  - 512
  use_ln_post: true
  width: 384
training:
  amp: true
  amp_dtype: bf16
  batch_size: 4
  betas:
  - 0.9
  - 0.99
  eikonal_warmup_steps: 4000
  grad_accum: 2
  grad_clip: 1.0
  kl_warmup_steps: 2000
  lambda_kl: 0.0001
  log_every: 25
  lr: 0.0004
  min_lr_ratio: 0.05
  num_workers: 4
  output_dir: checkpoints/vae_probe
  save_every: 300
  seed: 0
  steps: 400
  val_every: 150
  warmup_steps: 500
  weight_decay: 0.01
  data_parallel: flat
